spring.application.name=tienda

#Para definir el puerto donde "escuchará" el servidor
server.port=8080

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false
#Conexión local a la BD TechShop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop
spring.datasource.username=root
spring.datasource.password=shago1407

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MySQLDialect se detecta automáticamente; no es necesario declararlo explícitamente
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Deshabilitar open-in-view para evitar queries durante el render de vistas
spring.jpa.open-in-view=false

#Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Esta informacion se utiliza para obtener acceso a su storage
firebase.bucket.name=techshop-7a50b.appspot.com
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-7a50b-firebase-adminsdk-fbsvc-5e945a8915.json